services:
  # Development
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3031:3031"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    profiles:
      - dev

  # Production
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    profiles:
      - prod
